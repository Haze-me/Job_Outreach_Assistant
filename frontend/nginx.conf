server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Probe target for Kubernetes. Kept out of the access log so liveness
    # checks do not drown out real traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely --
    # a new build produces new names rather than new contents at the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current asset
    # hashes, and a stale copy pins the browser to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths are client-side routes (/companies/:id and
    # friends), so they resolve to the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # The app is served in an iframe by nothing, and loads no third-party
    # scripts; these cost nothing and close off obvious footguns.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
