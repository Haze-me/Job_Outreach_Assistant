name: CI_Backend API

on:
  push:
    branches: [main, develop]
    # Monorepo: only rebuild this image when the backend actually changes.
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  IMAGE_NAME: haze21/job-outreach-backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          # The Dockerfile lives in backend/, not the repo root.
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Rollout Restart on K3s
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Rollout restart backend and worker
        run: |
          kubectl rollout restart deployment/backend -n job-outreach
          kubectl rollout restart deployment/celery-worker -n job-outreach
          kubectl rollout status deployment/backend -n job-outreach --timeout=90s
          kubectl rollout status deployment/celery-worker -n job-outreach --timeout=90s