name: CI — Frontend UI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

env:
  IMAGE_NAME: haze21/job-outreach-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          # Relative: the Ingress serves the UI and the API from one host, so
          # the browser resolves /api against the page's own origin. Keeps the
          # image environment-independent.
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Rollout Restart on K3s
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Rollout restart frontend
        run: |
          kubectl rollout restart deployment/frontend -n job-outreach
          kubectl rollout status deployment/frontend -n job-outreach --timeout=90s