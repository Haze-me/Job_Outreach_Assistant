# TEMPLATE ONLY -- do not apply this file and do not commit a filled-in copy.
#
# Create the real Secret imperatively so the values never touch git:
#
#   kubectl -n job-outreach create secret generic joa-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=POSTGRES_PASSWORD='choose-a-strong-password' \
#     --from-literal=DATABASE_URL='postgres://joa:choose-a-strong-password@joa-postgres:5432/job_outreach'
#
# POSTGRES_PASSWORD and the password inside DATABASE_URL must match; they are
# two views of the same credential and Postgres will simply refuse the
# connection if they drift.
apiVersion: v1
kind: Secret
metadata:
  name: joa-secrets
  namespace: job-outreach
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-me-with-64-random-characters"
  POSTGRES_PASSWORD: "replace-me"
  DATABASE_URL: "postgres://joa:replace-me@joa-postgres:5432/job_outreach"
