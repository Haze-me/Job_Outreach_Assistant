apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: job-outreach
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # Postgres is usually still starting when this Job is created. Block here
      # rather than burning through backoffLimit on connection refusals.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              # No -U: this only needs to know the server is accepting
              # connections, so it stays correct whatever POSTGRES_USER is.
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: haze21/job-outreach-backend:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets