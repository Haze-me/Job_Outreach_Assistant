# One hostname, routed by path.
#
# This is what lets the frontend ship with VITE_API_BASE_URL="/api" -- a
# relative path the browser resolves against whichever origin served the page.
# The bundle contains no hostname, so the same image runs in every environment,
# and because the UI and API share an origin there is no CORS at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-outreach-ingress
  namespace: job-outreach
  annotations:
    # Both entrypoints while TLS is not yet configured; drop "web" once
    # certificates are issued and SECURE_SSL_REDIRECT is turned on.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: email.emchrismobility.com
      http:
        paths:
          # More specific prefixes first. /static carries the Django admin and
          # Swagger UI assets, served by WhiteNoise from the backend image.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # Uncomment with cert-manager, then set SECURE_SSL_REDIRECT=True and
  # SECURE_HSTS_SECONDS=31536000 in the ConfigMap.
  # tls:
  #   - hosts:
  #       - email.emchrismobility.com
  #     secretName: job-outreach-tls
