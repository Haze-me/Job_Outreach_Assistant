apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: job-outreach
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  CORS_ALLOWED_ORIGINS: "https://email.emchrismobility.com"
  CSRF_TRUSTED_ORIGINS: "https://email.emchrismobility.com"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "job_db"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  DJANGO_ALLOWED_HOSTS: "email.emchrismobility.com"