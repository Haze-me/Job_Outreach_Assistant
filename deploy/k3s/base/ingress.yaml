apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-outreach-ingress
  namespace: job-outreach
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - email.emchrimobility.com
      secretName: job-outreach-tls
  rules:
    - host: email.emchrimobility.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80