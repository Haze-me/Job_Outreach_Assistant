apiVersion: v1
kind: Service
metadata:
  name: joa-backend
  namespace: job-outreach
spec:
  selector:
    app: joa-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joa-backend
  namespace: job-outreach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joa-backend
  template:
    metadata:
      labels:
        app: joa-backend
    spec:
      containers:
        - name: backend
          image: haze21/joa-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: joa-config
            - secretRef:
                name: joa-secrets
          # Probes hit the pod IP, so without an explicit Host header Django
          # sees an IP it does not recognise and answers 400 -- the probe then
          # fails and the pod is killed in a loop. Setting Host to a value in
          # DJANGO_ALLOWED_HOSTS is the fix.
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: joa-backend
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: joa-backend
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          # /api/health/ reports the database too, so a pod that cannot reach
          # Postgres is taken out of the Service rather than serving errors.
          startupProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: joa-backend
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
