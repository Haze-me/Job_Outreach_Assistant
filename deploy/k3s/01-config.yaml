apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: job-outreach
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"

  # Must be DJANGO_ALLOWED_HOSTS, not ALLOWED_HOSTS: production settings read
  # env.list("DJANGO_ALLOWED_HOSTS") with no default, so a wrong key name means
  # every pod dies at import with ImproperlyConfigured.
  # "backend" is included so in-cluster calls and probes are accepted.
  DJANGO_ALLOWED_HOSTS: "email.emchrismobility.com,backend,localhost,127.0.0.1"

  # The UI and the API share one origin (the Ingress routes /api to the
  # backend), so the browser never makes a cross-origin request and CORS is
  # not exercised. Listed anyway so it is correct if that ever changes.
  CORS_ALLOWED_ORIGINS: "https://email.emchrismobility.com"
  CSRF_TRUSTED_ORIGINS: "https://email.emchrismobility.com"

  # Leave False until TLS is genuinely terminating. Production defaults this to
  # True; without a certificate Django 301s http->https, nothing serves https,
  # and the browser loops. Flip both once cert-manager issues a certificate.
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "0"

  # Consumed by the postgres container itself. Django does not read these --
  # it uses DATABASE_URL from the Secret.
  POSTGRES_DB: "job_outreach"

  # Celery. Service DNS inside the namespace; db 0 is the broker, db 1 the
  # result backend so flushing one cannot destroy the other.
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CELERY_TASK_ALWAYS_EAGER: "False"

  # Crawler
  CRAWLER_MAX_PAGES: "40"
  CRAWLER_MAX_DEPTH: "2"
  CRAWLER_DELAY_SECONDS: "0.5"
  CRAWLER_RESPECT_ROBOTS_TXT: "True"
  # Must stay False. In a cluster the pod network reaches every Service, and
  # the cloud metadata endpoint sits on a link-local address.
  CRAWLER_ALLOW_PRIVATE_NETWORKS: "False"
