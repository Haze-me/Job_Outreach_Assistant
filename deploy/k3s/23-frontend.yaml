apiVersion: v1
kind: Service
metadata:
  name: joa-frontend
  namespace: job-outreach
spec:
  selector:
    app: joa-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joa-frontend
  namespace: job-outreach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joa-frontend
  template:
    metadata:
      labels:
        app: joa-frontend
    spec:
      containers:
        - name: frontend
          image: haze21/joa-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          # Static file serving needs very little.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
