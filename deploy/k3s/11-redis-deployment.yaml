apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: job-outreach
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Persist the queue so a restart does not silently drop queued scans,
          # and never evict: losing a broker message loses a user's scan.
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      # Without this block the Deployment is rejected: the volumeMount above
      # names a volume that does not exist.
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc